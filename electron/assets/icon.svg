<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>MZ EXPORT</title>

  <!--
    Marque MZ EXPORT.

    Contraintes de lisibilite : cette icone est rendue jusqu'a 16x16 pixels dans
    la barre des taches. D'ou les choix suivants.
      - Aplat plutot que degrade : un degrade devient une bouillie en dessous
        de 32 pixels.
      - Lettres tres grasses et largement espacees : elles restent distinctes
        la ou un trait fin fusionnerait.
      - Fond opaque : l'icone se detache aussi bien sur une barre des taches
        claire que sombre.
  -->

  <rect width="256" height="256" rx="52" ry="52" fill="#1e2f52" />

  <!-- Liseré interne : donne du relief sans recourir a une ombre. -->
  <rect x="6" y="6" width="244" height="244" rx="47" ry="47"
        fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3" />

  <g fill="#ffffff" font-family="Segoe UI, Arial, Helvetica, sans-serif"
     font-weight="700" text-anchor="middle">
    <text x="128" y="152" font-size="104" letter-spacing="2">MZ</text>
  </g>

  <!-- Accent bleu acier, reprise de la palette des graphiques (#5b8dd0). -->
  <rect x="80" y="178" width="96" height="12" rx="6" ry="6" fill="#5b8dd0" />
</svg>
